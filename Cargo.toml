[package]
name = "eval_run_guard"
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Privacy-first offline integrity checks for agent evaluation JSONL runs"
repository = "https://github.com/Tinkora/eval_run_guard"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.12"
