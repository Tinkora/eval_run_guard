name: Bug report
description: Report a reproducible eval_run_guard defect using synthetic data.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Never include secrets or private evaluation records.
    validations:
      required: true
