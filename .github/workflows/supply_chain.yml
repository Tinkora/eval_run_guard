name: Supply chain
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "31 4 * * 1"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.95.0 --profile minimal --no-self-update
      - run: cargo +1.95.0 install cargo-deny --version 0.18.9 --locked
      - run: cargo +1.95.0 deny check advisories bans licenses sources
