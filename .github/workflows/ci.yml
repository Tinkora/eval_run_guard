name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  docs:
    name: Documentation quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npx --yes markdownlint-cli2@0.20.0 '**/*.md'
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt,clippy --no-self-update
      - run: cargo +1.85.0 fmt --all -- --check
      - run: cargo +1.85.0 test --locked
      - run: cargo +1.85.0 clippy --workspace --all-targets --locked -- -D warnings
